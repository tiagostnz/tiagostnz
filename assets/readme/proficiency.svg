<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d" xml:space="preserve">
  <title id="t">Tecnologias que mais uso</title>
  <desc id="d">JavaScript e TypeScript 90%, React e Next.js 85%, HTML e CSS 80%, Python 55%, Java 45%.</desc>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="270" rx="16" fill="#050308"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g id="row-1">
      <text x="48" y="31" font-size="16" fill="#F5F3FF">JavaScript / TypeScript</text>
      <rect x="480" y="20" width="620" height="14" rx="7" fill="#120B1C"/>
      <rect x="480" y="20" width="558" height="14" rx="7" fill="url(#barGrad)"/>
      <text x="1150" y="31" font-size="15" font-weight="bold" text-anchor="end" fill="#C4B5FD">90%</text>
    </g>
    <g id="row-2">
      <text x="48" y="85" font-size="16" fill="#F5F3FF">React / Next.js</text>
      <rect x="480" y="74" width="620" height="14" rx="7" fill="#120B1C"/>
      <rect x="480" y="74" width="527" height="14" rx="7" fill="url(#barGrad)"/>
      <text x="1150" y="85" font-size="15" font-weight="bold" text-anchor="end" fill="#C4B5FD">85%</text>
    </g>
    <g id="row-3">
      <text x="48" y="139" font-size="16" fill="#F5F3FF">HTML / CSS</text>
      <rect x="480" y="128" width="620" height="14" rx="7" fill="#120B1C"/>
      <rect x="480" y="128" width="496" height="14" rx="7" fill="url(#barGrad)"/>
      <text x="1150" y="139" font-size="15" font-weight="bold" text-anchor="end" fill="#C4B5FD">80%</text>
    </g>
    <g id="row-4">
      <text x="48" y="193" font-size="16" fill="#F5F3FF">Python</text>
      <rect x="480" y="182" width="620" height="14" rx="7" fill="#120B1C"/>
      <rect x="480" y="182" width="341" height="14" rx="7" fill="url(#barGrad)"/>
      <text x="1150" y="193" font-size="15" font-weight="bold" text-anchor="end" fill="#C4B5FD">55%</text>
    </g>
    <g id="row-5">
      <text x="48" y="247" font-size="16" fill="#F5F3FF">Java</text>
      <rect x="480" y="236" width="620" height="14" rx="7" fill="#120B1C"/>
      <rect x="480" y="236" width="279" height="14" rx="7" fill="url(#barGrad)"/>
      <text x="1150" y="247" font-size="15" font-weight="bold" text-anchor="end" fill="#C4B5FD">45%</text>
    </g>
